name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barista-clicker
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: barista-clicker/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Derle
        run: npm run build

      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v5

      - name: Derlenen siteyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: barista-clicker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
